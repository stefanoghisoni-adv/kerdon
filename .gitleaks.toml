title = "Kerdon gitleaks configuration"

# Le regole di default di gitleaks, piu' l'allowlist qui sotto. Senza questo
# blocco un file di configurazione sostituisce le regole invece di estenderle:
# gitleaks non ne avrebbe nessuna, e direbbe sempre "no leaks found".
[extend]
  useDefault = true

[allowlist]
  description = "Allowlist for test fixtures and dummy credentials"

  # Test files with dummy credentials and fixtures
  paths = [
    '''e2e/ambiente\.ts''',
    '''app/lib/queue/.*\.test\.ts''',
  ]

  # Niente regex globali: `shpat_[0-9a-f]{32}` e' esattamente il formato dei
  # token admin veri, e allowlistarla ignorerebbe proprio un token trapelato.
  # Le fixture sono coperte dai percorsi qui sopra.
