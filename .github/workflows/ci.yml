name: CI

# Test + typecheck + build. The deploy is NOT run here: production deploys use
# Vercel's Git integration (free, auto-deploy on push to main).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    # Un indirizzo di database finto ma sintatticamente valido.
    #
    # `prisma generate` non si collega a niente — legge lo schema e scrive il
    # client — ma `prisma.config.ts` pretende comunque che la variabile ci sia,
    # e senza fallisce prima di cominciare. Da li' la CI era rossa su ogni
    # commit, e una CI sempre rossa non e' un cancello: e' un allarme che si
    # impara a ignorare.
    #
    # Sta QUI e non nel codice di proposito: un ripiego silenzioso dentro
    # l'applicazione un giorno punterebbe le migrazioni al database sbagliato,
    # e sarebbe un guaio molto peggiore di una CI che si lamenta.
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_non_esiste?schema=public

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test -- --run

      - name: Build
        run: npm run build
