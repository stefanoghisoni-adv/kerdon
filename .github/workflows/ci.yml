name: CI

# Test + typecheck + build. The deploy is NOT run here: production deploys use
# Vercel's Git integration (free, auto-deploy on push to main).

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest

    # Un indirizzo di database finto ma sintatticamente valido.
    #
    # `prisma generate` non si collega a niente — legge lo schema e scrive il
    # client — ma `prisma.config.ts` pretende comunque che la variabile ci sia,
    # e senza fallisce prima di cominciare. Da li' la CI era rossa su ogni
    # commit, e una CI sempre rossa non e' un cancello: e' un allarme che si
    # impara a ignorare.
    #
    # Sta QUI e non nel codice di proposito: un ripiego silenzioso dentro
    # l'applicazione un giorno punterebbe le migrazioni al database sbagliato,
    # e sarebbe un guaio molto peggiore di una CI che si lamenta.
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci_non_esiste?schema=public

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test -- --run

      - name: Build
        run: npm run build

      # Il worker e' un artefatto a se': ha il suo bundle e la sua immagine, e
      # nessuno dei due passava di qui. Un worker che non si costruisce piu' si
      # scopriva al deploy.
      - name: Build worker bundle
        run: npm run worker:build

  # Da un database vuoto si arriva davvero allo schema che l'app si aspetta?
  #
  # `owner-bootstrap.sql` e' l'unica strada per ricostruire il database
  # dell'app: non c'e' una migration iniziale, quindi `prisma migrate deploy` su
  # un database vuoto non arriva da nessuna parte. Ed e' anche l'unico file che
  # nessuno esegue mai — un ambiente si ricostruisce una volta l'anno — quindi
  # quando resta indietro non lo scopre nessuno. E' gia' successo due volte.
  #
  # Il test unitario confronta il file con lo schema leggendoli. Questo lo
  # ESEGUE, su un Postgres vero, e poi chiede a Prisma se lo schema ottenuto
  # differisce da quello dichiarato. Sono due controlli diversi: il primo dice
  # "il file dice le cose giuste", il secondo "il file fa le cose giuste".
  bootstrap:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: coreward_vuoto
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # Due indirizzi per lo stesso database, e servono entrambi.
    #
    # Prisma vuole `?schema=public`; `psql` quel parametro non lo conosce e
    # rifiuta l'intero indirizzo con "invalid URI query parameter: schema". Con
    # un solo valore uno dei due strumenti si ferma sempre — ed e' quello che
    # succedeva: il job moriva al primo `psql` e i controlli su deriva, dati
    # iniziali e RLS non venivano mai eseguiti.
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/coreward_vuoto?schema=public
      PSQL_URL: postgresql://ci:ci@localhost:5432/coreward_vuoto

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      # `-v ON_ERROR_STOP=1`: senza, psql tira dritto dopo un errore e lo script
      # "riesce" avendo creato meta' schema — che e' esattamente il guasto che
      # questo job deve scoprire.
      - name: Apply owner-bootstrap.sql to an empty database
        run: psql "$PSQL_URL" -v ON_ERROR_STOP=1 -f prisma/owner-bootstrap.sql

      # `migrate diff --exit-code` da solo non serve: su questo database la
      # risposta e' sempre "si', c'e' differenza", perche' le due chiavi esterne
      # sul nome del piano stanno nel database e non nello schema. Il passo era
      # quindi rosso a ogni esecuzione — un cancello sempre rosso non e' un
      # cancello. `expected-drift.ts` fa la domanda giusta: la differenza e' SOLO
      # quella conosciuta? E in piu' verifica il rovescio, che il diff da solo
      # non vede: che quelle due chiavi esterne ci siano ancora.
      - name: Compare the resulting database with the Prisma schema
        run: npx tsx prisma/expected-drift.ts

      # Le righe iniziali e RLS: quello che `migrate diff` non guarda.
      - name: Check seed rows and row level security
        run: psql "$PSQL_URL" -v ON_ERROR_STOP=1 -f prisma/bootstrap-check.sql

  # E da un database vuoto ci si arriva anche con Prisma?
  #
  # E' la domanda che il job `bootstrap` non fa: quello prova lo SCRIPT, questo
  # prova le MIGRAZIONI. Finche' mancava una migrazione iniziale la risposta era
  # no, e non c'era modo di portare il database owner allo schema nuovo se non
  # incollando SQL a mano nell'editor di Supabase — cioe' senza revisione, senza
  # una traccia di cosa fosse stato applicato e senza modo di rifarlo uguale.
  #
  # Tre cose, in ordine:
  #   1. `migrate deploy` su un database vuoto arriva allo schema dichiarato;
  #   2. il database che ne esce ha i dati iniziali, RLS ovunque e le due chiavi
  #      esterne sul nome del piano;
  #   3. la procedura di linea di base descritta in docs/database-migrations.md
  #      funziona davvero: un database costruito con lo script e poi dichiarato
  #      in linea non ha piu' niente da applicare.
  migrations:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: coreward_migrazioni
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    # Due indirizzi per lo stesso database, come nel job qui sopra: Prisma vuole
    # `?schema=public`, psql quel parametro non lo conosce e rifiuta l'intero
    # indirizzo con "invalid URI query parameter: schema".
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/coreward_migrazioni?schema=public
      PSQL_URL: postgresql://ci:ci@localhost:5432/coreward_migrazioni
      PSQL_ADMIN: postgresql://ci:ci@localhost:5432/postgres
      BASE_DATABASE_URL: postgresql://ci:ci@localhost:5432/coreward_linea?schema=public
      BASE_PSQL_URL: postgresql://ci:ci@localhost:5432/coreward_linea

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Apply every migration to an empty database
        run: npx prisma migrate deploy

      - name: Compare the resulting database with the Prisma schema
        run: npx tsx prisma/expected-drift.ts

      - name: Check seed rows, row level security and the plan foreign keys
        run: psql "$PSQL_URL" -v ON_ERROR_STOP=1 -f prisma/bootstrap-check.sql

      # La prova della linea di base, che e' il passo che il proprietario dovra'
      # eseguire una volta sola sul database di produzione. Qui si fa su un
      # database costruito con lo script, che e' cio' che la produzione e':
      # dopo `migrate resolve --applied` non deve restare niente da applicare.
      # Se un giorno restasse qualcosa, vorrebbe dire che una migrazione nuova e'
      # stata inserita PRIMA di una gia' dichiarata in linea, e su un database
      # vero verrebbe saltata in silenzio.
      - name: Rehearse the baseline procedure on a script-built database
        run: |
          psql "$PSQL_ADMIN" -v ON_ERROR_STOP=1 -c 'CREATE DATABASE coreward_linea'
          psql "$BASE_PSQL_URL" -v ON_ERROR_STOP=1 -f prisma/owner-bootstrap.sql

          for cartella in prisma/migrations/*/; do
            DATABASE_URL="$BASE_DATABASE_URL" \
              npx prisma migrate resolve --applied "$(basename "$cartella")"
          done

          DATABASE_URL="$BASE_DATABASE_URL" npx prisma migrate status

          DATABASE_URL="$BASE_DATABASE_URL" npx prisma migrate deploy | tee applicate.txt
          grep -q "No pending migrations to apply" applicate.txt
