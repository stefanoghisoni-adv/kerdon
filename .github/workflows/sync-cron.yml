name: Sync Cron Trigger

# Il giro ogni 30 minuti.
#
# Vercel Cron sul piano Free arriva al massimo a una volta al giorno: quella
# corsa c'e' gia' (`vercel.json`, alle 03:00) e fa da rete. Questo workflow e' il
# giro frequente, ed e' l'unico motivo per cui i dati del merchant non restano
# fermi ventiquattr'ore.
#
# L'INDIRIZZO STA QUI, e non fra le Variables del repository.
#
# Prima era `vars.APP_URL`, e non era mai stata configurata: `curl` riceveva un
# URL che cominciava con "/api/...", falliva, e il giro frequente non e' mai
# partito da quando esiste. Una variabile che vive in un pannello, che va tenuta
# allineata al dominio a mano e che nessuno vede quando manca, e' un pezzo di
# configurazione che si rompe in silenzio. Il dominio dell'app e' stabile e sta
# in git, dove si legge e si rivede insieme al resto.
#
# `vars.APP_URL` resta come scavalco, per chi lavora su un fork o su un
# ambiente di prova. Se c'e', deve essere il dominio IN USO e non uno che ci
# reindirizza: il vecchio supabase-sync-six.vercel.app risponde 307 verso
# quello nuovo, e un 307 non e' un errore — `curl` senza `-L` lo prende, esce
# con successo, e il giro non avviene. Seguirlo non aiuterebbe, perche' `curl`
# non porta l'header `Authorization` su un host diverso e arriverebbe un 401.
# Il controllo qui sotto rende rumoroso quel caso invece di ripararlo di
# nascosto.
#
# Il segreto invece resta un segreto: Secrets → CRON_SECRET, lo stesso valore
# che sta fra le env di Vercel.

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/cron/sync
        run: |
          set -euo pipefail

          if [ -z "${CRON_SECRET:-}" ]; then
            echo "CRON_SECRET non e' configurato fra i Secrets del repository." >&2
            exit 1
          fi

          codice=$(curl -sS -o /tmp/cron-body.txt -w '%{http_code}' \
            "$APP_URL/api/cron/sync" \
            -H "Authorization: Bearer $CRON_SECRET")

          echo "HTTP $codice"
          cat /tmp/cron-body.txt

          case "$codice" in
            2*) ;;
            3*)
              echo >&2
              echo "APP_URL punta a un dominio che reindirizza ($codice): il giro NON e' partito." >&2
              echo "Va messo il dominio in uso, non uno che ci porta." >&2
              exit 1
              ;;
            *)
              echo >&2
              echo "La chiamata al cron e' fallita con HTTP $codice." >&2
              exit 1
              ;;
          esac
        env:
          # Il dominio in uso; `vars.APP_URL` lo scavalca dove serve.
          APP_URL: ${{ vars.APP_URL || 'https://api.kerdon.io' }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
