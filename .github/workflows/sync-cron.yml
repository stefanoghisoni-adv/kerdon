name: Sync Cron Trigger

# Vercel Cron on the Free plan runs at most once per day, so the every-30-minutes
# periodic sync is delegated to GitHub Actions (free).
#
# Configure in repo settings:
#   - Variables: APP_URL = https://api.coreward.app
#   - Secrets:   CRON_SECRET (from Vercel env var)
#
# APP_URL deve essere il dominio IN USO, non uno che ci reindirizza. Il dominio
# vecchio (supabase-sync-six.vercel.app) risponde 307 verso quello nuovo, e un
# 307 non e' un errore: `curl` senza `-L` lo prende, esce con successo e la
# sincronizzazione non parte. Nessun errore da nessuna parte, e il giro non
# avviene — che e' esattamente il modo in cui un cron smette di girare senza che
# nessuno se ne accorga.
#
# Nemmeno seguire il reindirizzamento sarebbe una soluzione: `curl` non porta
# l'header `Authorization` su un host diverso, quindi arriverebbe senza segreto
# e si prenderebbe un 401. Il controllo qui sotto rende rumoroso il caso invece
# di ripararlo di nascosto.

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

jobs:
  trigger:
    runs-on: ubuntu-latest
    steps:
      - name: Call /api/cron/sync
        run: |
          set -euo pipefail

          if [ -z "${APP_URL:-}" ]; then
            echo "APP_URL non e' configurata fra le Variables del repository." >&2
            exit 1
          fi

          codice=$(curl -sS -o /tmp/cron-body.txt -w '%{http_code}' \
            "$APP_URL/api/cron/sync" \
            -H "Authorization: Bearer $CRON_SECRET")

          echo "HTTP $codice"
          cat /tmp/cron-body.txt

          case "$codice" in
            2*) ;;
            3*)
              echo >&2
              echo "APP_URL punta a un dominio che reindirizza ($codice): il giro NON e' partito." >&2
              echo "Va messo il dominio in uso, non uno che ci porta." >&2
              exit 1
              ;;
            *)
              echo >&2
              echo "La chiamata al cron e' fallita con HTTP $codice." >&2
              exit 1
              ;;
          esac
        env:
          APP_URL: ${{ vars.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
