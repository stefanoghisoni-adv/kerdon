# Il connettore delle migrazioni. Prisma lo scrive da solo alla prima
# `migrate dev`; qui mancava perche' le migrazioni sono nate a mano, una alla
# volta, incollate nell'SQL editor.
#
# Senza questo file `prisma migrate diff --from-migrations` si ferma con
# "Could not determine the connector to use for the migrations", quindi non
# c'era modo di chiedere a Prisma se la catena delle migrazioni porta davvero
# allo schema dichiarato: l'unica verifica possibile era eseguirle e guardare.
#
# Please do not edit this file manually
# It should be added in your version-control system (i.e. Git)
provider = "postgresql"
