# Il Worker che chiude il giro del tracciamento, sul dominio del negozio.
#
# I valori qui sotto sono quelli da cambiare: il nome, la rotta e l'indirizzo
# dell'API. Il codice non si tocca.

name = "kerdon-id"
main = "worker.js"
compatibility_date = "2025-01-01"

# La rotta su cui il Worker risponde.
#
# DEVE stare sul dominio da cui si vede la vetrina, non su un altro: e' l'unica
# cosa che renda first-party il cookie, ed e' tutta la ragione per cui questo
# Worker esiste. `negozio.it` va sostituito con il dominio vero del negozio.
routes = [
  { pattern = "negozio.it/kerdon/id", zone_name = "negozio.it" }
]

[vars]
# L'indirizzo dell'API, come parametro e non cablato nel codice: il giorno in
# cui cambia si modifica qui e si ripubblica.
KERDON_URL = "https://api.coreward.app"

# Il dominio su cui piantare il cookie. Con il punto davanti vale anche per i
# sottodomini, che e' quel che serve se la vetrina sta su `www` e il Worker no.
COOKIE_DOMAIN = ".negozio.it"

# LE CHIAVI NON VANNO QUI. Sono tre valori e si caricano come segreti:
#
#   npx wrangler secret put KERDON_TOKEN            # la chiave di lettura
#   npx wrangler secret put KERDON_INGEST_KEY_ID    # l'identificativo di invio
#   npx wrangler secret put KERDON_INGEST_SECRET    # il segreto di invio
#
# Scritte in questo file finirebbero nel controllo di versione, e una chiave in
# un repository e' una chiave da revocare.
#
# PERCHE' DUE CREDENZIALI E NON UNA. Questa rotta non si limita a leggere:
# conia l'identificativo del visitatore e ne registra la riga nel database del
# negozio. Finche' bastava la chiave di lettura, chiunque l'avesse per farsi
# restituire i dati poteva anche riempire quelle tabelle. Adesso leggere e
# scrivere sono due permessi distinti, con due credenziali che si ruotano e si
# revocano l'una senza toccare l'altra.
#
# Il segreto di invio non viaggia mai: il Worker lo usa per calcolare una firma,
# ed e' la firma che parte. Il valore intero si vede UNA VOLTA SOLA, nel momento
# in cui lo si crea in Impostazioni: se lo si perde se ne crea un altro, e
# quello di prima continua a funzionare per due giorni — il tempo di
# ripubblicare.
