# CoreWard — configurazione dell'app Shopify
#
# Questo file e' la fonte di verita': `shopify app deploy` sovrascrive i campi
# del dashboard, non il contrario. Si modifica qui, poi si fa il deploy.
#
# URL di produzione: https://api.coreward.app
#
# Un solo redirect dichiarato, e per una ragione di sicurezza: un indirizzo
# lasciato fra quelli consentiti dopo che non serve piu' e' un varco che si
# apre da solo il giorno in cui quel nome torna libero — chi lo rivendicasse
# riceverebbe i codici di autorizzazione destinati a noi. L'indirizzo Vercel
# ora inoltra qui da se', quindi non c'e' nulla da tenere aperto.

client_id = "461a83c84e9ce41a23b5364f1c1140ad"
name = "CoreWard"
application_url = "https://api.coreward.app"
embedded = true

[access_scopes]
# write_products risulta non usato: l'unica scrittura verso Shopify e' su
# inventory_items (costo per articolo). Resta finche' non si decide di toglierlo,
# perche' ridurre gli scope fa ripassare i merchant dal consenso.
scopes = "read_products,write_products,read_inventory,write_inventory,read_customers,read_publications,read_themes,read_orders,read_all_orders"
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
redirect_urls = [
  "https://api.coreward.app/auth/callback"
]

[webhooks]
# 2025-01 e non la piu' recente proposta dalla CLI: e' la versione con cui e'
# scritto il codice (ApiVersion.January25 in app/shopify.server.ts, e
# SHOPIFY_API_VERSION nelle variabili d'ambiente). Alzarla qui cambierebbe la
# forma dei payload in arrivo senza che i gestori se ne accorgano.
api_version = "2025-01"

[[webhooks.subscriptions]]
topics = ["products/create"]
uri = "/webhooks/products/create"

[[webhooks.subscriptions]]
topics = ["products/update"]
uri = "/webhooks/products/update"

[[webhooks.subscriptions]]
topics = ["products/delete"]
uri = "/webhooks/products/delete"

[[webhooks.subscriptions]]
topics = ["customers/create"]
uri = "/webhooks/customers/create"

[[webhooks.subscriptions]]
topics = ["customers/update"]
uri = "/webhooks/customers/update"

[[webhooks.subscriptions]]
topics = ["customers/delete"]
uri = "/webhooks/customers/delete"

# Gli ordini sono l'unica cosa che non aspetta la corsa periodica: e' il momento
# in cui i numeri del negozio cambiano davvero, e saperlo fra sei ore e' tardi
# per chi sta guardando come gira una campagna.
# Due topic perche' un ordine cambia anche dopo: pagato, evaso, annullato — e un
# ordine annullato che resta a bilancio racconta un profitto che non c'e'.
[[webhooks.subscriptions]]
topics = ["orders/create"]
uri = "/webhooks/orders"

[[webhooks.subscriptions]]
topics = ["orders/updated"]
uri = "/webhooks/orders"

[[webhooks.subscriptions]]
topics = ["app_subscriptions/update"]
uri = "/webhooks/app-subscriptions/update"

[[webhooks.subscriptions]]
topics = ["app/uninstalled"]
uri = "/webhooks/app/uninstalled"

[[webhooks.subscriptions]]
compliance_topics = ["customers/data_request"]
uri = "/webhooks/gdpr/data-request"

[[webhooks.subscriptions]]
compliance_topics = ["customers/redact"]
uri = "/webhooks/gdpr/customers-redact"

[[webhooks.subscriptions]]
compliance_topics = ["shop/redact"]
uri = "/webhooks/gdpr/shop-redact"
