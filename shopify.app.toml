# CoreWard — configurazione dell'app Shopify
#
# Questo file e' la fonte di verita': `shopify app deploy` sovrascrive i campi
# del dashboard, non il contrario. Si modifica qui, poi si fa il deploy.
#
# URL di produzione: https://api.kerdon.io
#
# L'indirizzo di prima, api.coreward.app, resta acceso e inoltra qui: una
# sessione aperta o un webhook gia' in volo quando l'indirizzo e' cambiato non
# deve cadere nel vuoto.
#
# Un solo redirect dichiarato, e per una ragione di sicurezza: un indirizzo
# lasciato fra quelli consentiti dopo che non serve piu' e' un varco che si
# apre da solo il giorno in cui quel nome torna libero — chi lo rivendicasse
# riceverebbe i codici di autorizzazione destinati a noi. L'indirizzo Vercel
# ora inoltra qui da se', quindi non c'e' nulla da tenere aperto.

client_id = "461a83c84e9ce41a23b5364f1c1140ad"
name = "Kerdon"
application_url = "https://api.kerdon.io"
embedded = true

[access_scopes]
# write_customers serve a due cose: creare la definizione del metafield "Data di
# nascita" dalla tab Clienti e scrivere il valore di quel metafield quando il
# merchant ha il dato e Shopify no. Shopify non ha uno scope dedicato alle
# definizioni dei metafield — chiede quello di scrittura del tipo a cui la
# definizione appartiene, quindi write_customers per i metafield del cliente.
# L'app non scrive nessun cliente (nome, email, telefono, indirizzo), solo il
# metafield della data di nascita.
#
# read_all_orders serve alla sincronizzazione dello storico: l'app calcola
# profitto e LTV su tutti gli ordini del negozio, non solo quelli recenti.
scopes = "read_products,read_inventory,write_inventory,read_customers,write_customers,read_publications,read_themes,read_orders,read_all_orders,read_shipping,read_returns"
optional_scopes = [ ]
use_legacy_install_flow = false

[auth]
redirect_urls = [
  "https://api.kerdon.io/auth/callback"
]

[webhooks]
# 2026-07 e' la versione API piu' recente supportata (Shopify mantiene le ultime
# 4 versioni trimestrali, cioe' 12 mesi, quindi al 27 agosto 2026 sono supportate
# October25, January26, April26 e July26). Corrisponde a ApiVersion.July26 in
# app/shopify.server.ts e a SHOPIFY_API_VERSION nelle variabili d'ambiente.
api_version = "2026-07"

[[webhooks.subscriptions]]
topics = ["products/create"]
uri = "/webhooks/products/create"

[[webhooks.subscriptions]]
topics = ["products/update"]
uri = "/webhooks/products/update"

[[webhooks.subscriptions]]
topics = ["products/delete"]
uri = "/webhooks/products/delete"

[[webhooks.subscriptions]]
topics = ["customers/create"]
uri = "/webhooks/customers/create"

[[webhooks.subscriptions]]
topics = ["customers/update"]
uri = "/webhooks/customers/update"

[[webhooks.subscriptions]]
topics = ["customers/delete"]
uri = "/webhooks/customers/delete"

# Gli ordini sono l'unica cosa che non aspetta la corsa periodica: e' il momento
# in cui i numeri del negozio cambiano davvero, e saperlo fra sei ore e' tardi
# per chi sta guardando come gira una campagna.
# Piu' topic perche' un ordine cambia anche dopo: pagato, evaso, annullato,
# rimborsato — e un ordine annullato che resta a bilancio racconta un profitto
# che non c'e'.
#
# `refunds/create` e' l'aggiunta che mancava, e mancava proprio dove faceva piu'
# danno: un rimborso non crea ne' modifica righe, cambia solo quanto di quelle
# righe e' rimasto al cliente. Senza questo topic il margine restava quello del
# giorno dell'acquisto fino alla corsa periodica successiva.
#
# Tutti e tre allo stesso handler perche' fanno la stessa cosa: dicono QUALE
# ordine e' cambiato, e l'ordine si rilegge.
[[webhooks.subscriptions]]
topics = ["orders/create"]
uri = "/webhooks/orders"

[[webhooks.subscriptions]]
topics = ["orders/updated"]
uri = "/webhooks/orders"

[[webhooks.subscriptions]]
topics = ["refunds/create"]
uri = "/webhooks/orders"

# La cancellazione ha un handler suo: non c'e' niente da rileggere, e dalla
# ricevuta si prende il solo identificativo per togliere ordine e righe.
[[webhooks.subscriptions]]
topics = ["orders/delete"]
uri = "/webhooks/orders/delete"

[[webhooks.subscriptions]]
topics = ["app_subscriptions/update"]
uri = "/webhooks/app-subscriptions/update"

[[webhooks.subscriptions]]
topics = ["app/uninstalled"]
uri = "/webhooks/app/uninstalled"

[[webhooks.subscriptions]]
compliance_topics = ["customers/data_request"]
uri = "/webhooks/gdpr/data-request"

[[webhooks.subscriptions]]
compliance_topics = ["customers/redact"]
uri = "/webhooks/gdpr/customers-redact"

[[webhooks.subscriptions]]
compliance_topics = ["shop/redact"]
uri = "/webhooks/gdpr/shop-redact"
